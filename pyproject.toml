[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-automation-tools"
version = "1.0.0"
description = "Testable, vendor-aware utilities for network engineers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Moore" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
automation = ["netmiko>=4.4,<5"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.12,<0.13", "pre-commit>=4,<5"]

[project.scripts]
network-tools = "network_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/network_tools"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
